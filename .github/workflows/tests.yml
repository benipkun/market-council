# Runs the tests of the engine's key numbers on every change to the code. The inputs are made up and
# the expected figures can be checked by hand, so nothing private is involved. The calculation
# engine runs the same tests before every run and does not run if one fails.
name: Tests
on:
  push:
    branches: [main]
    paths: ["ops/**", "tests/**", "mc/**", "index.html", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and scipy
        run: pip install --quiet numpy scipy
      - name: Run the tests
        run: python tests/test_numbers.py
      - name: Check every app script parses
        # board cycle 1: a broken quote in mc/p11.js stopped TODAY's action list for half an hour
        run: |
          for f in mc/*.js; do node --check "$f" || exit 1; done
          echo "app scripts parse"
      - name: Tell the phone if this job failed
        if: failure()
        env:
          MC_TOKEN: ${{ secrets.MC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || true)
          if [ "$prev" = "failure" ]; then echo "Already reported after the previous failed run."; exit 0; fi
          # The message leaves through the private records: a file in outbox/queue/ there is sent to the phone by its "Send phone messages" job.
          jq -n --arg m "A change to the code failed its tests at $(date -u +%H:%M) UTC. The engine will not run until they pass. Open SYSTEM in the app." '{title:"Market Council: a job failed",message:$m,click:"https://benipkun.github.io/market-council/#system",tags:["warning"]}' > /tmp/alert.json
          rm -rf /tmp/rec
          if git clone -q --depth 1 "https://x-access-token:${MC_TOKEN}@github.com/benipkun/market-council-state.git" /tmp/rec >/dev/null 2>&1; then
            cd /tmp/rec && mkdir -p outbox/queue && cp /tmp/alert.json "outbox/queue/$(date -u +%Y%m%dT%H%M%SZ)-job-failed.json"
            git config user.name "Market Council Engine" && git config user.email "engine@market-council.local"
            if git add outbox/queue >/dev/null 2>&1 && git commit -q -m "Alert: a job failed" >/dev/null 2>&1 && git push -q origin HEAD:main >/dev/null 2>&1; then echo "alert queued for the phone"; else echo "alert NOT queued: the private records refused the message"; fi
          else echo "alert NOT queued: the private records could not be reached"; fi
