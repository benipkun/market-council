# Market Council health check: every half hour it asks when each job last ran and how it ended, reads
# the dates inside the private records, and sends one phone message when a job was skipped, results
# went stale or the price check is holding cards back (ops/health.py has the rules). The result goes
# to the private records (state/health.json) for the SYSTEM screen. This public log only says whether
# the check ran. Once a week it also writes a one-line heartbeat file here, because GitHub switches
# off the schedules of a public repository that sees no change for 60 days.
name: Health check
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: health-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch the private records
        uses: actions/checkout@v4
        with:
          repository: benipkun/market-council-state
          token: ${{ secrets.MC_TOKEN }}
          ref: main
      - name: Fetch this repository's code
        uses: actions/checkout@v4
        with:
          path: _code
      - name: Check the jobs and the data
        env:
          NTFY_OUT: ${{ secrets.NTFY_OUT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MC_TOKEN: ${{ secrets.MC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # when the records token expires (GitHub sends the date with every answer); kept out of this public log
          export TOKEN_EXPIRES=$(curl -sI -m 20 -H "Authorization: Bearer $MC_TOKEN" https://api.github.com/rate_limit | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          mkdir -p ops/engine state/logs && cp _code/ops/health.py ops/ && cp _code/ops/engine/actions.py _code/ops/engine/keeper.py _code/ops/engine/answer.py _code/ops/engine/agent_questions.md _code/ops/engine/tradecheck.py _code/ops/engine/board.py ops/engine/
          if python3 ops/health.py > /tmp/health.txt 2>&1; then echo "health: checked"; else echo "health: FAILED (details in the private records, state/logs/health.txt)"; echo health >> /tmp/failed; fi
          # questions the Trade Inbox has not answered within 20 minutes are answered by the action list's own code
          python3 ops/engine/keeper.py asks > /tmp/keeper.txt 2>&1 || echo "keeper: FAILED" >> /tmp/keeper.txt
          echo "keeper: ran"
          # a trade that just reached the books: checked, classified, and one phone message (the relay starts this job)
          python3 ops/engine/tradecheck.py > /tmp/tradecheck.txt 2>&1 || echo "tradecheck: FAILED" >> /tmp/keeper.txt
          echo "trade check: ran"
          # your yes or no on a review-board card, recorded at once
          [ -e state/board/cards.json ] && { python3 ops/engine/board.py answers > /dev/null 2>&1 || echo "board answers: FAILED" >> /tmp/keeper.txt; }
          EXPO=""; [ -e state/exposure.json ] && EXPO=state/exposure.json
          [ -e state/board/cards.json ] && EXPO="$EXPO state/board/cards.json"
          if [ -s /tmp/failed ] || [ -n "$(git status --porcelain state/health.json outbox inbox/queue state/messages.json $EXPO)" ]; then
            { date -u +%Y-%m-%dT%H:%MZ; cat /tmp/health.txt; } > state/logs/health.txt
            # Git's own messages can name files, so they stay out of this public log.
            exec 3>&1 >/tmp/git.txt 2>&1
            git config user.name "Market Council Engine"
            git config user.email "engine@market-council.local"
            # inbox, not inbox/queue: an empty queue folder does not exist in git, and adding a missing path fails the step
            git add -A state/health.json state/logs/health.txt outbox inbox state/messages.json state/keeper.json $EXPO
            if ! git diff --cached --quiet; then
              git commit -q -m "Health check $(date -u +%Y-%m-%dT%H:%MZ)"
              git reset -q --hard HEAD
              for i in 1 2 3; do
                if git fetch -q origin main && git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep 4
              done
            fi
            exec >&3 2>&1
          fi
          if [ -s /tmp/failed ]; then exit 1; fi
      - name: Weekly heartbeat for this repository
        run: |
          cd _code
          week=$(date -u +%G-W%V)
          if [ "$(cat heartbeat.txt 2>/dev/null)" != "$week" ]; then
            echo "$week" > heartbeat.txt
            git config user.name "Market Council Engine"
            git config user.email "engine@market-council.local"
            git add heartbeat.txt
            git commit -q -m "Weekly heartbeat $week"
            git push -q || echo "The heartbeat could not be saved this time."
          fi
      - name: Tell the phone if this job failed
        if: failure()
        env:
          MC_TOKEN: ${{ secrets.MC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || true)
          if [ "$prev" = "failure" ]; then echo "Already reported after the previous failed run."; exit 0; fi
          # The message leaves through the private records: a file in outbox/queue/ there is sent to the phone by its "Send phone messages" job.
          jq -n --arg m "The health check itself failed at $(date -u +%H:%M) UTC, so skipped jobs and stale data are not being watched right now. Open SYSTEM in the app." '{title:"Market Council: a job failed",message:$m,click:"https://benipkun.github.io/market-council/#system",tags:["warning"]}' > /tmp/alert.json
          rm -rf /tmp/rec
          if git clone -q --depth 1 "https://x-access-token:${MC_TOKEN}@github.com/benipkun/market-council-state.git" /tmp/rec >/dev/null 2>&1; then
            cd /tmp/rec && mkdir -p outbox/queue && cp /tmp/alert.json "outbox/queue/$(date -u +%Y%m%dT%H%M%SZ)-job-failed.json"
            git config user.name "Market Council Engine" && git config user.email "engine@market-council.local"
            if git add outbox/queue >/dev/null 2>&1 && git commit -q -m "Alert: a job failed" >/dev/null 2>&1 && git push -q origin HEAD:main >/dev/null 2>&1; then echo "alert queued for the phone"; else echo "alert NOT queued: the private records refused the message"; fi
          else echo "alert NOT queued: the private records could not be reached"; fi
