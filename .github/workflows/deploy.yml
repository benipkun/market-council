# The live app is published only after the tests pass (24 Nov 2026). Needs Settings > Pages > Source: GitHub Actions.
# Until that one setting is changed this job has no effect on the live site.
name: Publish the app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-app
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy scipy
      - run: python tests/test_numbers.py
      - run: '[ ! -f tests/test_money.py ] || python tests/test_money.py'
      - name: Check every app script parses
        run: for f in mc/*.js; do node --check "$f" || exit 1; done
      - name: Build the site folder
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png .nojekyll mc _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
