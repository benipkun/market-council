# The clock (17 Nov 2026). GitHub starts scheduled jobs late or not at all when it is busy: on 17 Nov the half-hourly
# health and changes check ran 4 times in 12 hours and the 13:40 engine run never started, so the pipeline's cost gate
# read a stale "nothing changed" and skipped a -1% market day for 10 hours. This job does not wait for the schedule: it
# stays awake for five and a half hours, starts the health check every 30 minutes and the engine at 06:40, 13:40 and
# 21:40 UTC on weekdays (skipping any that already started on their own), then starts the next clock before it ends.
# The schedule below is only a backstop that restarts the chain if it ever breaks. Public repository: no cost.
name: Clock
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: clock
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Keep time for five and a half hours
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          started() {   # minutes since the newest run of a workflow was created (999 if none)
            t=$(gh run list -R "$R" -w "$1" -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
            [ -n "$t" ] && echo $(( ($(date +%s) - $(date -d "$t" +%s)) / 60 )) || echo 999
          }
          end=$(( $(date +%s) + 330 * 60 ))
          done_slots=""
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$(started watch.yml)" -ge 28 ]; then
              gh workflow run watch.yml -R "$R" && echo "$(date -u +%H:%M) health and changes check started"
            fi
            H=$(date -u +%H); M=$(date -u +%M); D=$(date -u +%u); slot="$(date -u +%F)-$H"
            if [ "$D" -le 5 ] && { [ "$H" = 06 ] || [ "$H" = 13 ] || [ "$H" = 21 ]; } && [ "${M#0}" -ge 40 ] && ! echo "$done_slots" | grep -q "$slot"; then
              if [ "$(started engine.yml)" -ge 45 ]; then
                gh workflow run engine.yml -R "$R" -f quick=0 && echo "$(date -u +%H:%M) engine started"
              else
                echo "$(date -u +%H:%M) engine already started on its own"
              fi
              done_slots="$done_slots $slot"
            fi
            sleep 60
          done
      - name: Hand over to the next clock
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clock.yml -R "${{ github.repository }}" && echo "next clock queued"
